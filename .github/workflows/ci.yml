name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Lint
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest

  # Builds the real executable and starts it, so a broken spec file or a start-up crash is caught on every push,
  # not only when a release tag is pushed.
  build-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - name: Build executables
        run: |
          python -m PyInstaller --noconfirm SCUM_Chat_Translator.spec
          python -m PyInstaller --noconfirm SCUM_Chat_Translator_Portable.spec
      - name: Smoke-test the built executables
        shell: pwsh
        run: ./scripts/smoke_test_exe.ps1 dist/SCUM_Chat_Translator.exe dist/SCUM_Chat_Translator_Portable.exe
