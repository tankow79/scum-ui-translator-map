name: Build release binaries

# Pushing a tag such as v2.1.0 builds both executables and publishes a release for that tag, using
# .github/release-notes/<tag>.md as the description (GitHub shows SHA-256 digests for the assets).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
      - name: Build executables
        run: |
          python -m PyInstaller --noconfirm SCUM_Chat_Translator.spec
          python -m PyInstaller --noconfirm SCUM_Chat_Translator_Portable.spec
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          name: SCUM Tactical Map & Chat Translator ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          draft: false
          files: |
            dist/SCUM_Chat_Translator.exe
            dist/SCUM_Chat_Translator_Portable.exe
