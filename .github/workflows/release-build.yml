name: Build release binaries

# Pushing a tag such as v2.1.0 builds both executables and publishes a release for that tag, using
# .github/release-notes/<tag>.md as the description (GitHub shows SHA-256 digests for the assets).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - name: Tag must match the app version
        shell: pwsh
        run: |
          $version = python -c "from core.version import __version__; print(__version__)"
          if ("${{ github.ref_name }}" -ne "v$version") { throw "Tag ${{ github.ref_name }} does not match core/version.py ($version)" }
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
      - name: Build executables
        run: |
          python -m PyInstaller --noconfirm SCUM_Chat_Translator.spec
          python -m PyInstaller --noconfirm SCUM_Chat_Translator_Portable.spec
      - name: Smoke-test the built executables
        shell: pwsh
        run: ./scripts/smoke_test_exe.ps1 dist/SCUM_Chat_Translator.exe dist/SCUM_Chat_Translator_Portable.exe
      - name: Package full zip (exe + instructions)
        shell: pwsh
        run: |
          $dir = "pkg/SCUM_Chat_Translator"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item dist/SCUM_Chat_Translator.exe $dir
          Copy-Item docs/instructions/INSTRUCTION_EN.txt $dir
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/SCUM_Chat_Translator_${{ github.ref_name }}.zip"
      - name: Attach to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: SCUM Tactical Map & Chat Translator ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          draft: false
          files: |
            dist/SCUM_Chat_Translator.exe
            dist/SCUM_Chat_Translator_Portable.exe
            dist/SCUM_Chat_Translator_${{ github.ref_name }}.zip
